[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-upscaler"
version = "0.1.0"
description = "Upscale images with ESRGAN models"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
image-upscaler = "image_upscaler.frontend:main"

[tool.setuptools]
packages = ["image_upscaler"]

[tool.setuptools.package-dir]
image_upscaler = "."

[tool.uv]
package = true
