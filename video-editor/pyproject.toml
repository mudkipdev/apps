[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editor"
version = "0.1.0"
description = "A small recipe-based video editor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
video-editor = "application:main"

[tool.setuptools]
py-modules = ["application", "ffmpeg", "model"]

[tool.uv]
package = true
