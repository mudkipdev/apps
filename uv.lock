version = 1
revision = 3
requires-python = ">=3.11"

[manifest]
members = [
    "apps",
    "image-upscaler",
    "video-editor",
]

[[package]]
name = "apps"
version = "0.0.0"
source = { virtual = "." }
dependencies = [
    { name = "image-upscaler" },
    { name = "video-editor" },
]

[package.metadata]
requires-dist = [
    { name = "image-upscaler", editable = "image-upscaler" },
    { name = "video-editor", editable = "video-editor" },
]

[[package]]
name = "image-upscaler"
version = "0.1.0"
source = { editable = "image-upscaler" }

[[package]]
name = "video-editor"
version = "0.1.0"
source = { editable = "video-editor" }
